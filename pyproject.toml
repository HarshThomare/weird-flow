[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weird-flow"
version = "0.1.0"
description = "Diffing-based localization of microarchitectural weird machines"
requires-python = ">=3.10"
dependencies = [
    "capstone==5.0.5",
    "pyelftools==0.31",
    "pyyaml>=6.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
llm = [
    "torch==2.6.0+cu124",
    "transformers>=4.40",
    "accelerate>=0.26",
]

# Driver on this box is CUDA 12.4. PyPI torch (2.14+cu130) makes
# torch.cuda.is_available() False. Pin the cu124 index only for torch.
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }

[project.scripts]
wf = "wf.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
