[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weird-flow"
version = "0.1.0"
description = "Diffing-based localization of microarchitectural weird machines"
requires-python = ">=3.10"
dependencies = [
    "capstone==5.0.5",
    "pyelftools==0.31",
    "pyyaml>=6.0",
    "pytest>=8.0",
]

[project.optional-dependencies]
llm = [
    "transformers>=4.40",
    "accelerate>=0.26",
]

[project.scripts]
wf = "wf.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"
